<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Lolita Bronze</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0D0814;
    color: #F5F5F5;
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    -webkit-user-select: none;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #2A1A32;
    border-top-color: #DFAF2B;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  h1 {
    font-size: 18px;
    margin: 0 0 6px;
  }
  p {
    font-size: 13px;
    color: #A9A3AE;
    max-width: 300px;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="titulo">Iniciando o sistema...</h1>
  <p id="mensagem">Conectando ao servidor local.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');

    if (status === 'slow') {
      document.getElementById('titulo').textContent = 'Ainda conectando...';
      document.getElementById('mensagem').textContent = 'Isso está demorando mais que o normal. Continue aguardando.';
    } else if (status === 'error') {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('titulo').textContent = 'Não foi possível conectar';
      document.getElementById('mensagem').textContent = 'Verifique sua conexão com a internet. O sistema vai continuar tentando automaticamente.';
    }
  </script>
</body>
</html>
